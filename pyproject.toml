[project]
name = "quantyx"
version = "0.1.0"
description = "A self-updating India DS/AI job market pipeline"
requires-python = ">=3.10,<3.14"

[tool.ruff]
line-length = 92
target-version = "py310"
exclude = [".venv", "dbt/target", "dashboard"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # argparse/pydantic idioms rely on calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
